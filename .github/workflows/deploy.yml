name: Production directe
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: vidfetch-production
  cancel-in-progress: false
jobs:
  production:
    if: github.repository == 'aouirdani/vidfetch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 12
    env:
      VIDFETCH_RELEASE: ${{ github.sha }}
      VIDFETCH_RELEASE_DIR: build/releases/${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --ignore-scripts
      - name: Fresh public SEO and AdSense reference
        run: python3 scripts/release/public_contract.py --output build/preflight/production.json
      - name: Build the immutable Linux production archive once
        run: |
          node scripts/ovh/build-release.mjs
          tar -czf build/release-${GITHUB_SHA}.tgz -C "${VIDFETCH_RELEASE_DIR}" .
      - run: npm run check:release
      - name: SEO, human review and protected engines on the actual archive
        run: npm run seo-check
      - name: Activate with existing health checks and automatic rollback
        id: activate
        env:
          DEPLOY_HOST: 15.235.127.165
          DEPLOY_USER: vidfetch-deploy
          DEPLOY_SSH_KEY: ${{ secrets.OVH_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OVH_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_ARCHIVE: build/release-${{ github.sha }}.tgz
        run: sh scripts/ovh/deploy.sh
      - name: Public production check (11 routes and robots/sitemap/ads.txt)
        id: public
        run: python3 scripts/release/public_contract.py --snapshot build/preflight/checked-release.json --subset --release "$GITHUB_SHA"
      - name: Automatically restore predecessor if the public check fails
        if: failure() && steps.activate.outcome == 'success' && steps.public.outcome == 'failure'
        env:
          DEPLOY_HOST: 15.235.127.165
          DEPLOY_USER: vidfetch-deploy
          DEPLOY_SSH_KEY: ${{ secrets.OVH_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OVH_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_OPERATION: rollback
        run: |
          sh scripts/ovh/deploy.sh
          python3 scripts/release/public_contract.py --snapshot build/preflight/production.json --subset --release-from-snapshot
      - name: Deployment result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: printf 'Commit %s — %s\n' "$GITHUB_SHA" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
