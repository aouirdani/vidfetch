name: Cached full checks environment
description: Node, npm, Next, and optional browser/media dependencies
inputs:
  browser:
    default: 'false'
    description: Install cached Playwright Chromium
  media:
    default: 'false'
    description: Install FFmpeg using cached Debian packages
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22.23.3
        cache: npm
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .next/cache
        key: next-checks-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
        restore-keys: |
          next-checks-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
          next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
    - run: npm ci --ignore-scripts
      shell: bash
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      if: inputs.browser == 'true'
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - if: inputs.browser == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      if: inputs.media == 'true'
      with:
        path: ~/.cache/vidfetch-ffmpeg
        key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-ubuntu24-v1
    - if: inputs.media == 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/.cache/vidfetch-ffmpeg/partial"
        sudo apt-get update -qq
        sudo apt-get -o "Dir::Cache::archives=$HOME/.cache/vidfetch-ffmpeg" -o Binary::apt::APT::Keep-Downloaded-Packages=true install -y ffmpeg
