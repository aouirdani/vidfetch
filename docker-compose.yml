services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidfetch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for Docker Compose}
      POSTGRES_DB: ${POSTGRES_DB:-vidfetch}
    volumes:
      - vidfetch-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    image: vidfetch:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vidfetch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vidfetch}
    command: ["npx", "drizzle-kit", "push", "--config=drizzle.config.ts"]
    restart: "no"

  app:
    image: vidfetch:local
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: ${CORS_ORIGIN:-https://vidfetch.app}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vidfetch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vidfetch}
      YTDLP_PATH: /opt/vidfetch/bin/yt-dlp
      FFMPEG_PATH: /usr/bin/ffmpeg
      MAX_PARALLEL_DOWNLOADS: ${MAX_PARALLEL_DOWNLOADS:-4}
    ports:
      - "5001:5000"

volumes:
  vidfetch-db:
