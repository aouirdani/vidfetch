<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VidFetch home — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Onest:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#10163A}a:hover{color:#2F5BFF}
.m-stage{perspective:1000px;perspective-origin:50% 30%;position:relative;width:100%;height:300px}
.m-float{position:absolute;inset:0;transform-style:preserve-3d;animation:m-float 7s ease-in-out infinite}
@keyframes m-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.m-card{position:absolute;left:50%;top:40px;width:150px;height:266px;margin-left:-95px;border-radius:22px;overflow:hidden;transition:transform .9s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 28px 50px -22px rgba(16,22,58,.55),0 10px 20px -10px rgba(47,91,255,.4)}
.m-c1{transform:rotateY(-26deg) rotateX(10deg)}
.m-c2{transform:rotateY(-26deg) rotateX(10deg) translate3d(28px,-10px,-60px)}
.m-c3{transform:rotateY(-26deg) rotateX(10deg) translate3d(56px,-20px,-120px)}
.m-token{position:absolute;left:50%;display:flex;align-items:center;gap:8px;padding:9px 12px 9px 9px;border-radius:14px;background:#FFFFFF;color:#10163A;box-shadow:0 18px 30px -14px rgba(16,22,58,.45)}
.m-t1{top:70px;transform:translate3d(24px,0,50px) rotateY(-14deg)}
.m-t2{top:170px;transform:translate3d(36px,0,40px) rotateY(-14deg)}
.m-field:focus-within{box-shadow:0 0 0 3px #2F5BFF}
.m-input:focus{outline:none}
.m-btn:focus-visible{outline:3px solid #2F5BFF;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.m-float{animation:none}.m-card{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #EEF1F8; color: #10163A; font-family: 'Onest', system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px">
<a href="#top" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #10163A">
<span style="width: 32px; height: 32px; border-radius: 9px; background: #2F5BFF; display: flex; align-items: center; justify-content: center; transform: rotate(-8deg)">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z" fill="#FFFFFF"></path></svg>
</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.02em">VidFetch</span>
</a>
<button class="m-btn" type="button" aria-label="Open menu" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #C9D1EA; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10163A" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
</button>
</header>

<div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 42px; line-height: 0.98; letter-spacing: -0.035em">Save TikTok videos as MP4 or MP3</h1>
<p style="margin: 0; font-size: 16px; color: #3F4668">Paste a public link you’re allowed to keep. It saves straight to your phone.</p>
<form style="display: flex; flex-direction: column; gap: 8px" onSubmit="{{submit}}">
<label for="m-url" style="font-size: 13px; font-weight: 600">TikTok link</label>
<div class="m-field" style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 6px 0 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #D5DBEE">
<input id="m-url" class="m-input" type="url" placeholder="vm.tiktok.com/…" style="flex: 1 1 auto; min-width: 0; height: 100%; border: 0; background: transparent; font: inherit; color: #10163A">
<button class="m-btn" type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #D5DBEE; background: #F4F6FC; color: #10163A; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Paste</button>
</div>
<button class="m-btn" type="submit" style="height: 56px; border-radius: 18px; border: 0; background: #2F5BFF; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; box-shadow: 0 16px 26px -14px rgba(47,91,255,.8)">Get formats</button>
</form>
<p style="margin: 0; font-size: 13px; color: #4A5072">Free, no account. Only save videos you own or may download.</p>
</div>

<div aria-hidden="true" style="position: relative; flex: 1 1 auto; min-height: 0">
<div style="position: absolute; left: 50%; top: 30px; width: 300px; height: 300px; margin-left: -150px; border-radius: 50%; background: #DCE3F8"></div>
<div class="m-stage">
<div class="m-float">
<div class="m-card m-c3" style="background: #FFC233"></div>
<div class="m-card m-c2" style="background: #2F5BFF"></div>
<div class="m-card m-c1" style="background: #131B4D">
<div style="position: absolute; left: 50%; top: 56px; width: 70px; height: 70px; margin-left: -35px; border-radius: 50%; background: #FFC233"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: #2F5BFF"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 62px; background: #1E3FD6"></div>
<div style="position: absolute; left: 12px; right: 12px; bottom: 14px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35)">
<div style="width: 42%; height: 100%; border-radius: 2px; background: #FFC233"></div>
</div>
</div>
<div class="m-token m-t1">
<span style="width: 30px; height: 30px; border-radius: 9px; background: #2F5BFF; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 16 16"><path d="M5 3v10l8-5z" fill="#FFFFFF"></path></svg>
</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px">MP4</span>
</div>
<div class="m-token m-t2">
<span style="width: 30px; height: 30px; border-radius: 9px; background: #FFC233; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10163A" stroke-width="2.4" stroke-linecap="round"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg>
</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px">MP3</span>
</div>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      submit: (event) => { if (event && event.preventDefault) event.preventDefault(); },
    };
  }
}
</script>
</body>
</html>
