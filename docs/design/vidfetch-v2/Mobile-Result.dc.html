<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VidFetch format choice — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Onest:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#10163A}a:hover{color:#2F5BFF}
.r-stage{perspective:1000px}
.r-card{transform:rotateY(-10deg) rotateX(6deg);transform-origin:50% 60%;animation:r-in .9s cubic-bezier(.2,.8,.2,1) backwards;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 30px 50px -24px rgba(16,22,58,.55),0 10px 20px -10px rgba(47,91,255,.4)}
@keyframes r-in{from{transform:rotateY(-28deg) rotateX(10deg) translateY(30px);opacity:0}}
.r-opt{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.r-opt:active{transform:scale(.98)}
.r-btn:focus-visible,.r-opt:focus-visible{outline:3px solid #2F5BFF;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.r-card{animation:none}.r-opt{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #EEF1F8; color: #10163A; font-family: 'Onest', system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 12px; padding: 16px 20px">
<a class="r-btn" href="Mobile-Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #C9D1EA; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10163A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em">Choose a format</span>
</header>

<div style="padding: 4px 20px 0; display: flex; gap: 16px; align-items: flex-start">
<div class="r-stage" style="flex: 0 0 auto">
<div class="r-card" style="position: relative; width: 118px; height: 210px; border-radius: 20px; overflow: hidden; background: #131B4D">
<div style="position: absolute; left: 50%; top: 44px; width: 54px; height: 54px; margin-left: -27px; border-radius: 50%; background: #FFC233"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: #2F5BFF"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: #1E3FD6"></div>
<div style="position: absolute; right: 8px; bottom: 10px; padding: 2px 7px; border-radius: 7px; background: rgba(9,12,36,.6); color: #FFFFFF; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums">00:33</div>
</div>
</div>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 6px">
<span style="display: inline-flex; align-self: flex-start; height: 26px; align-items: center; padding: 0 10px; border-radius: 999px; background: #DCE3F8; font-size: 12px; font-weight: 600">TikTok</span>
<span style="font-size: 17px; font-weight: 600; line-height: 1.3">[Video title]</span>
<span style="font-size: 14px; color: #4A5072">[@creator], 33 seconds</span>
</div>
</div>

<div role="radiogroup" aria-label="Format" style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{options}}" as="opt" hint-placeholder-count="3">
<button class="r-opt" type="button" role="radio" aria-checked="{{opt.checked}}" onClick="{{opt.pick}}" style="{{opt.boxStyle}}">
<span style="{{opt.iconStyle}}">
<sc-if value="{{opt.isAudio}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10163A" stroke-width="2" stroke-linecap="round"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg>
</sc-if>
<sc-if value="{{opt.isVideo}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M10 9.5v5l4.5-2.5z" fill="#FFFFFF"></path></svg>
</sc-if>
</span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px">{{opt.title}}</span>
<span style="font-size: 13px; color: #4A5072">{{opt.detail}}</span>
</span>
<span style="{{opt.dotStyle}}"></span>
</button>
</sc-for>
</div>

<div style="margin-top: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<button class="r-btn" type="button" style="height: 58px; border-radius: 18px; border: 0; background: #2F5BFF; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 16px 26px -14px rgba(47,91,255,.8)">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
{{saveLabel}}
</button>
<p style="margin: 0; text-align: center; font-size: 13px; color: #4A5072">The file goes to your phone. No account needed.</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'mp4-720' };
  }
  renderVals() {
    const list = [
      { id: 'mp4-720', title: 'MP4 720p', detail: 'Best quality, H.264, about 6 MB', audio: false, save: 'Save MP4 720p' },
      { id: 'mp4-540', title: 'MP4 540p', detail: 'Smaller file, about 3 MB', audio: false, save: 'Save MP4 540p' },
      { id: 'mp3', title: 'MP3', detail: 'Sound only, 192 kbps', audio: true, save: 'Save MP3' },
    ];
    const picked = this.state.picked;
    const current = list.find((o) => o.id === picked) || list[0];
    const options = list.map((o) => {
      const on = o.id === picked;
      return {
        title: o.title,
        detail: o.detail,
        isAudio: o.audio,
        isVideo: !o.audio,
        checked: on ? 'true' : 'false',
        pick: () => this.setState({ picked: o.id }),
        boxStyle: 'display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px; padding: 12px 16px 12px 12px; border-radius: 20px; background: #FFFFFF; color: #10163A; font: inherit; text-align: left; cursor: pointer; border: 2px solid ' + (on ? '#2F5BFF' : '#DDE2F0') + '; box-shadow: ' + (on ? '0 18px 30px -18px rgba(47,91,255,.7)' : 'none') + '; transform: ' + (on ? 'translateY(-2px)' : 'none'),
        iconStyle: 'flex: 0 0 auto; width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center; background: ' + (o.audio ? '#FFC233' : '#2F5BFF'),
        dotStyle: 'flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; border: ' + (on ? '7px solid #2F5BFF' : '2px solid #B8C1DE'),
      };
    });
    return { options, saveLabel: current.save };
  }
}
</script>
</body>
</html>
